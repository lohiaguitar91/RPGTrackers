<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#12141a">
<title>RPG Trackers</title>
<style>
  :root{--void:#12141a;--panel:#1e222c;--line:#2b303c;--ink:#e8e9ee;--ink-dim:#9aa0b0;
    --mono:'JetBrains Mono','SF Mono','Courier New',monospace;}
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--void);color:var(--ink);min-height:100vh;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:calc(56px + env(safe-area-inset-top)) 20px 60px;}
  .wrap{max-width:640px;margin:0 auto;}
  .eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;
    font-size:11px;color:var(--ink-dim);margin-bottom:10px;}
  h1{font-family:Georgia,serif;font-size:clamp(28px,6vw,40px);margin:0 0 8px;}
  p.sub{color:var(--ink-dim);font-size:15px;line-height:1.6;margin:0 0 36px;}
  a.tile{display:block;text-decoration:none;color:inherit;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px;
    transition:border-color .18s ease,transform .18s ease;-webkit-tap-highlight-color:transparent;}
  a.tile:hover,a.tile:focus-visible{transform:translateY(-2px);}
  a.tile.kotor:hover,a.tile.kotor:focus-visible{border-color:#5ec8ff;}
  a.tile.tw3:hover,a.tile.tw3:focus-visible{border-color:#c9a227;}
  a.tile img{display:block;width:100%;height:auto;aspect-ratio:460/215;object-fit:cover;
    border-bottom:1px solid var(--line);}
  .tile-body{padding:18px 20px 20px;}
  .tile-body h2{font-family:Georgia,serif;font-size:20px;margin:0 0 6px;}
  .tile-body .meta{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;
    letter-spacing:.1em;color:var(--ink-dim);}
  a.tile.kotor .meta em{color:#5ec8ff;font-style:normal;}
  a.tile.tw3 .meta em{color:#c9a227;font-style:normal;}
  footer{margin-top:44px;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);}
  @media (prefers-reduced-motion:reduce){a.tile{transition:none;}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Playthrough logs</div>
    <h1>RPG Trackers</h1>
    <p class="sub">Build guides and progress checklists, organized by game. Each tracker saves its own progress in your browser.</p>

    <a class="tile kotor" href="./starwars-kotor2/">
      <img src="./starwars-kotor2/cover.jpg" alt="Star Wars: Knights of the Old Republic II — The Sith Lords">
      <div class="tile-body">
        <h2>Knights of the Old Republic II</h2>
        <div class="meta"><em>1 build</em> &nbsp;//&nbsp; The Sith Lords</div>
      </div>
    </a>

    <a class="tile tw3" href="./witcher3/">
      <img src="./witcher3/cover.jpg" alt="The Witcher 3: Wild Hunt">
      <div class="tile-body">
        <h2>The Witcher 3</h2>
        <div class="meta"><em>1 build</em> &nbsp;//&nbsp; Wild Hunt + HoS + B&amp;W</div>
      </div>
    </a>

    <footer>hosted on github pages</footer>
  </div>
</body>
</html>
